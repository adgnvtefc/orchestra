[project]
name = "orchestra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
orchestra = "orchestra.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: summarize skips/xfails at the end.  --strict-markers: a typo'd marker is an error.
# Live tests hit a real model server; they're opt-in: `uv run pytest -m live`.
addopts = ["-ra", "--strict-markers", "-m", "not live"]
markers = [
    "live: needs a running oMLX server and OMLX_API_KEY (deselected by default)",
]
